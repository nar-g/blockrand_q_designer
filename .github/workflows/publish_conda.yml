name: Publish Conda Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: 3.9

      - name: Create and activate environment
        run: |
          conda create --name buildenv python=3.9 -y
          conda init bash
          bash -c "source ~/.bashrc && conda activate buildenv"  # Fix: Use 'conda activate' properly

      - name: Install Dependencies
        run: |
          conda install -n buildenv -c conda-forge conda-build anaconda-client

      - name: Build Conda Package
        run: |
          # Replace "recipe" with the folder containing your meta.yaml
          conda build recipe --output-folder build_output

      - name: Upload Package to Anaconda Cloud
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          # Find the built package (you may need to adjust the path if your package has a different name)
          PACKAGE_PATH=$(find build_output/ -name "*.tar.bz2")
          echo "Uploading package: $PACKAGE_PATH"
          anaconda -t $ANACONDA_API_TOKEN upload --user nar-g $PACKAGE_PATH